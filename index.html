<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Little by Little — Habit Tracker</title>
  <style>
    :root {
      --ink: #222b27;
      --muted: #78827d;
      --green: #3f725a;
      --green-light: #eaf1ec;
      --paper: #fbfaf7;
      --line: #e9e8e1;
      --white: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 20px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 10% 0%, #eff2e9 0, transparent 38%),
        var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      width: min(100%, 680px);
      margin: 0 auto;
    }

    header { margin-bottom: 30px; }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--green);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(36px, 8vw, 54px);
      font-weight: 500;
      letter-spacing: -.04em;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .date {
      margin-top: 22px;
      color: var(--muted);
      font-size: 14px;
    }

    .panel {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, .78);
      box-shadow: 0 12px 36px rgba(40, 48, 42, .045);
    }

    .progress-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .progress-title { font-weight: 700; }

    .progress-count {
      color: var(--green);
      font-size: 14px;
      font-weight: 700;
    }

    .progress-track {
      height: 9px;
      overflow: hidden;
      border-radius: 20px;
      background: #edf0eb;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--green);
      transition: width .25s ease;
    }

    form {
      display: flex;
      gap: 10px;
      margin: 22px 0;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
      background: var(--white);
      color: var(--ink);
      font: inherit;
    }

    input:focus {
      border-color: #8aaa96;
      box-shadow: 0 0 0 3px rgba(63, 114, 90, .1);
    }

    button { font: inherit; }

    .add-button {
      padding: 0 18px;
      border: 0;
      border-radius: 11px;
      background: var(--green);
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s ease, transform .15s ease;
    }

    .add-button:hover { background: #315e48; }
    .add-button:active { transform: scale(.97); }

    .habit-list {
      display: grid;
      gap: 10px;
    }

    .habit {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--white);
      transition: border-color .2s ease, background .2s ease;
    }

    .habit.done {
      border-color: #dbe7de;
      background: #f7faf7;
    }

    .check-button {
      display: grid;
      width: 27px;
      height: 27px;
      flex: 0 0 27px;
      place-items: center;
      border: 1.5px solid #cbd3cc;
      border-radius: 50%;
      background: white;
      color: white;
      cursor: pointer;
      transition: all .18s ease;
    }

    .check-button:hover { border-color: var(--green); }

    .done .check-button {
      border-color: var(--green);
      background: var(--green);
    }

    .habit-info { min-width: 0; flex: 1; }

    .habit-name {
      overflow-wrap: anywhere;
      font-weight: 650;
    }

    .done .habit-name { color: #77837b; }

    .streak {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .delete-button {
      padding: 7px 9px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #9aa19c;
      cursor: pointer;
    }

    .delete-button:hover {
      background: #f7eded;
      color: #a64d4d;
    }

    .empty {
      padding: 28px 14px;
      border: 1px dashed #d9ded8;
      border-radius: 13px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    .note {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 480px) {
      body { padding: 32px 15px; }
      .panel { padding: 18px; }
      form { gap: 8px; }
      .add-button { padding: 0 13px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">A little progress, every day</p>
      <h1>Little by Little</h1>
      <p class="subtitle">Build small habits. Show up for yourself.</p>
      <div class="date" id="todayDate"></div>
    </header>

    <section class="panel" aria-label="Habit tracker">
      <div class="progress-top">
        <span class="progress-title">Today's progress</span>
        <span class="progress-count" id="progressCount">0 of 0 done</span>
      </div>
      <div
        class="progress-track"
        role="progressbar"
        aria-label="Today's completed habits"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <form id="habitForm">
        <input
          id="habitInput"
          type="text"
          maxlength="60"
          placeholder="Add a habit, like “Read 10 pages”"
          aria-label="New habit"
          required
        />
        <button class="add-button" type="submit">Add habit</button>
      </form>

      <div class="habit-list" id="habitList"></div>
    </section>

    <p class="note">Your habits are saved on this device in this browser.</p>
  </main>

  <script>
    const STORAGE_KEY = "little-by-little-habits";

    const form = document.getElementById("habitForm");
    const input = document.getElementById("habitInput");
    const habitList = document.getElementById("habitList");
    const progressCount = document.getElementById("progressCount");
    const progressFill = document.getElementById("progressFill");
    const progressTrack = document.querySelector(".progress-track");

    function dateKey(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    document.getElementById("todayDate").textContent =
      new Intl.DateTimeFormat(undefined, {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      }).format(new Date());

    function loadHabits() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    let habits = loadHabits();

    function saveHabits() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
    }

    function getStreak(habit) {
      const completed = new Set(habit.completed || []);
      const cursor = new Date();
      const today = dateKey(cursor);

      // If today is not complete yet, count a streak through yesterday.
      if (!completed.has(today)) cursor.setDate(cursor.getDate() - 1);

      let streak = 0;
      while (completed.has(dateKey(cursor))) {
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      }
      return streak;
    }

    function render() {
      habitList.innerHTML = "";

      if (habits.length === 0) {
        habitList.innerHTML = `
          <div class="empty">
            No habits yet. Add one above to get started 🌱
          </div>
        `;
      }

      const today = dateKey();
      let completedToday = 0;

      habits.forEach((habit) => {
        const done = (habit.completed || []).includes(today);
        if (done) completedToday++;

        const card = document.createElement("div");
        card.className = `habit${done ? " done" : ""}`;

        const check = document.createElement("button");
        check.className = "check-button";
        check.type = "button";
        check.setAttribute("aria-label", done ? "Mark as not done" : "Mark as done");
        check.setAttribute("aria-pressed", String(done));
        check.textContent = done ? "✓" : "";
        check.addEventListener("click", () => toggleHabit(habit.id));

        const info = document.createElement("div");
        info.className = "habit-info";

        const name = document.createElement("div");
        name.className = "habit-name";
        name.textContent = habit.name;

        const streak = document.createElement("div");
        streak.className = "streak";
        const streakDays = getStreak(habit);
        streak.textContent = streakDays === 1
          ? "🔥 1 day streak"
          : `🔥 ${streakDays} day streak`;

        info.append(name, streak);

        const remove = document.createElement("button");
        remove.className = "delete-button";
        remove.type = "button";
        remove.textContent = "Remove";
        remove.setAttribute("aria-label", `Remove ${habit.name}`);
        remove.addEventListener("click", () => deleteHabit(habit.id));

        card.append(check, info, remove);
        habitList.append(card);
      });

      const total = habits.length;
      const percent = total ? Math.round((completedToday / total) * 100) : 0;

      progressCount.textContent = `${completedToday} of ${total} done`;
      progressFill.style.width = `${percent}%`;
      progressTrack.setAttribute("aria-valuenow", String(percent));
    }

    function toggleHabit(id) {
      const habit = habits.find((item) => item.id === id);
      if (!habit) return;

      const today = dateKey();
      const completed = new Set(habit.completed || []);

      if (completed.has(today)) {
        completed.delete(today);
      } else {
        completed.add(today);
      }

      habit.completed = [...completed];
      saveHabits();
      render();
    }

    function deleteHabit(id) {
      habits = habits.filter((habit) => habit.id !== id);
      saveHabits();
      render();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const name = input.value.trim();
      if (!name) return;

      habits.push({
        id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        name,
        completed: []
      });

      saveHabits();
      input.value = "";
      input.focus();
      render();
    });

    render();
  </script>
</body>
</html>
